spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test
    password: 12345678
    username: root
    hikari:
      auto-commit: true
      maximum-pool-size: 10
      minimum-idle: 10
